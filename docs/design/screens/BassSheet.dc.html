<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Helvetica Neue', sans-serif; }
    a { color: #FF7A18; } a:hover { color: #FF9445; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A1014; color: #EEF4F7; display: flex; flex-direction: column; padding: 64px 0 0 0;">

  <div style="padding: 0 24px;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 12px; background: #16281F; border: 1px solid #24503A;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5BD98C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
      <span style="font-size: 15px; font-weight: 600; color: #A8E9C2;">Nice fish! Logged 12:04pm</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; flex-direction: column; gap: 24px; padding: 14px 24px 40px 24px; background: #121A20; border-radius: 22px 22px 0 0; border-top: 1px solid #26333C;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <div style="width: 38px; height: 4px; border-radius: 999px; background: #33454F;"></div>
      <div style="display: flex; align-items: baseline; justify-content: space-between; width: 100%;">
        <span style="font-size: 17px; font-weight: 700;">While it&#39;s fresh &#8212;</span>
        <span style="font-size: 15px; font-weight: 600; color: #8CA0AC;">Skip</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em; color: #8CA0AC; text-transform: uppercase;">Water color</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <span style="display: flex; align-items: center; height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #33454F; font-size: 15px; font-weight: 600; color: #C3D2DA;">Clear</span>
        <span style="display: flex; align-items: center; height: 46px; padding: 0 18px; border-radius: 999px; background: #FF7A18; font-size: 15px; font-weight: 700; color: #140800;">Green</span>
        <span style="display: flex; align-items: center; height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #33454F; font-size: 15px; font-weight: 600; color: #C3D2DA;">Stained</span>
        <span style="display: flex; align-items: center; height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #33454F; font-size: 15px; font-weight: 600; color: #C3D2DA;">Muddy</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em; color: #8CA0AC; text-transform: uppercase;">Structure</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <span style="display: flex; align-items: center; height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #33454F; font-size: 15px; font-weight: 600; color: #C3D2DA;">Point</span>
        <span style="display: flex; align-items: center; height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #33454F; font-size: 15px; font-weight: 600; color: #C3D2DA;">Dock</span>
        <span style="display: flex; align-items: center; height: 46px; padding: 0 18px; border-radius: 999px; background: #FF7A18; font-size: 15px; font-weight: 700; color: #140800;">Timber</span>
        <span style="display: flex; align-items: center; height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #33454F; font-size: 15px; font-weight: 600; color: #C3D2DA;">Rock</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em; color: #8CA0AC; text-transform: uppercase;">Depth</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <span style="display: flex; align-items: center; height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #33454F; font-size: 15px; font-weight: 600; color: #C3D2DA;">0&#8211;5 ft</span>
        <span style="display: flex; align-items: center; height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #33454F; font-size: 15px; font-weight: 600; color: #C3D2DA;">5&#8211;15 ft</span>
        <span style="display: flex; align-items: center; height: 46px; padding: 0 18px; border-radius: 999px; border: 1.5px solid #33454F; font-size: 15px; font-weight: 600; color: #C3D2DA;">15 ft+</span>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
