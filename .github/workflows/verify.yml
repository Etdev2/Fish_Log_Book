# Runs the repository verification gate, a fresh-database migration smoke test, and build
# on every pull request and every push to main.
name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # SQL migrations are executable code. Running them in filename order against a fresh
    # PostgreSQL instance catches syntax, dependency, and ordering defects that static
    # TypeScript/unit checks cannot see. This service is isolated to the Actions runner.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fish_log_book_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fish_log_book_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fish_log_book_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Installs exactly the lockfile and also catches package/lockfile drift.
      - run: npm ci

      # tokens:check, tripwires, lint, tsc, and the unit/regression suite.
      - run: npm run verify

      # Apply every Supabase migration to a fresh Postgres database with ON_ERROR_STOP=1.
      # The harness bootstraps only the minimal auth/API-role surface the SQL expects.
      - name: Smoke-test database migrations
        run: bash scripts/check-migrations-postgres.sh

      # Vercel builds previews, but this keeps build correctness in the same required gate.
      - run: npm run build

      # Applies every migration to a real Postgres, then runs the database behaviour
      # checks. Nothing else in this workflow can tell whether the SQL runs: when this
      # step was added, the tournament migrations had never been applied anywhere and the
      # first run found four separate reasons they could not be — including a foreign key
      # Postgres refuses to create, and a view that selected three columns its table does
      # not have. Every one of those would have surfaced as a failed production deploy.
      #
      # Installed explicitly rather than relying on the runner image, because the script
      # exits 2 when it finds no server binaries and a skip that looks like a pass is
      # exactly the failure this step exists to prevent.
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-16

      - name: Migrations apply to a real database
        run: scripts/check-migrations-apply.sh

      # The layout rules that only a browser can check: horizontal overflow, the 48px
      # touch floor, one navigation system per tournament screen, no step counters, and
      # the live primary action clearing the fold.
      #
      # Every one of those started as a MEASUREMENT of this application — the primary
      # action sat 740px down a 640px viewport, two navigation systems pointed at the same
      # four places under different names, and the shortest label in the bottom bar was a
      # 45px target. None of them is visible to tsc, to ESLint, or to a test that reads the
      # files as text, and all of them are one refactor away from returning.
      #
      # Chromium only, and installed explicitly: check-layout.mjs exits 2 rather than 0
      # when the browser is missing, because a skip that reads as a pass is the failure
      # this step exists to prevent.
      - name: Install Chromium for the layout check
        run: npx playwright install --with-deps chromium

      # The server is started here rather than by the script, and BASE_URL points at it.
      # check-layout.mjs can spawn its own `next start` — the convenient local path — but
      # this is the one that has been run end to end, and a CI step should exercise the
      # path somebody has watched work.
      #
      # The readiness loop is curl rather than a helper package: one fewer dependency for
      # a job whose whole purpose is to be trustworthy, and a server that never comes up
      # fails here with a clear message instead of inside Playwright as a navigation
      # timeout.
      - name: Serve the production build and check the layout
        env:
          DEV_AUTH_BYPASS: "true"
          BASE_URL: http://127.0.0.1:3111
        run: |
          npx next start --port 3111 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3111/tournaments; then break; fi
            if ! kill -0 $server 2>/dev/null; then echo "next start exited early" >&2; exit 1; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:3111/tournaments || { echo "server never became ready" >&2; exit 1; }
          npm run layout
