name: Claude Code

# Wakes Claude Code (anthropics/claude-code-action, official) when Et or the Sweet Potato
# coordinator mentions @claude. Copied from Sweet Potato's control-room workflow so the
# coordinator can reach Claude here the same way (#145).
#
# Authentication comes from one repository secret, which Et adds; this file creates none:
# - CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token` (Et's Claude subscription), or
# - ANTHROPIC_API_KEY, from console.anthropic.com (billed as API usage; works from a phone).
# Until one exists, a mention starts a run that fails at the auth step and changes nothing.
#
# A mention is a wake, not authority: lanes and merges still follow docs/team/HOUSE-RULES.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

# No default token access; the job below asks only for what the action needs.
permissions: {}

concurrency:
  # One Claude run per issue or pull request at a time.
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only Et and the coordinator app may wake Claude. The action also refuses
    # actors without write access and bots not listed in allowed_bots.
    if: |
      (github.actor == 'Etdev2' || github.actor == 'sweet-potato-coordinator[bot]') && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: sweet-potato-coordinator[bot]
